  <style>
    :root {
      --bg: #FFFCF3; --surface: #FFFFFF; --ink: #1F1B0E; --ink-2: #4A4430; --muted: #6B6450;
      --line: rgb(70 55 10 / 0.22); --link: #7A5D00; --dot: rgb(140 110 20 / 0.17); --glow: rgb(247 217 76 / 0.30);
      --focus: #2F6FDB; --note-bg: #FFF7C9; --note-bar: #FDEB8F; --note-text: #2B2716;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16140E; --surface: #211E16; --ink: #F3EED8; --ink-2: #D6CFB5; --muted: #ADA68C;
        --line: rgb(255 240 190 / 0.18); --link: #E8C83A; --dot: rgb(255 230 150 / 0.09); --glow: rgb(247 217 76 / 0.09);
        --focus: #7CB4FF; --note-bg: #35311F; --note-bar: #5C5118; --note-text: #F3EED8;
        color-scheme: dark;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: grid; place-items: center; padding: 32px 16px; position: relative; isolation: isolate; overflow-x: hidden;
      font-family: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
      line-height: 1.6; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1;
      background: radial-gradient(ellipse 60% 45% at 50% 10%, var(--glow), transparent 70%),
                  radial-gradient(var(--dot) 1.1px, transparent 1.4px) 0 0 / 22px 22px;
    }
    main { max-width: 520px; text-align: center; }
    .note {
      width: 220px; margin: 0 auto 36px; overflow: hidden; text-align: left;
      color: var(--note-text); background: var(--note-bg); border-radius: 8px; transform: rotate(-4deg);
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.08), 0 22px 40px -18px rgb(60 40 0 / 0.45);
    }
    .note-bar { height: 22px; background: var(--note-bar); }
    .note p { margin: 0; padding: 10px 18px 20px; font-family: "Caveat", "Ink Free", "Segoe Print", cursive; font-size: 1.6rem; font-weight: 600; line-height: 1.15; }
    .note strong { display: block; font-size: 3.4rem; line-height: 1; }
    h1 { margin: 0; font-size: clamp(2rem, 1.4rem + 3vw, 2.75rem); font-weight: 780; letter-spacing: -0.035em; line-height: 1.1; }
    main > p { margin: 14px 0 0; color: var(--ink-2); font-size: 1.0625rem; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 30px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; padding: 0.8em 1.3em; border-radius: 12px;
      font-weight: 650; font-size: 1rem; text-decoration: none; border: 1px solid transparent;
    }
    .btn-primary { color: #2B2716; background: #F7D94C; border-color: rgb(150 115 0 / 0.32); box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.5), 0 8px 20px -10px rgb(190 150 0 / 0.75); }
    .btn-primary:hover { background: #FADF66; }
    .btn-secondary { color: var(--ink); background: var(--surface); border-color: var(--line); }
    .btn-secondary:hover { border-color: var(--muted); }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  </style>
</head>
