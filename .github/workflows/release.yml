name: Release

# Push a tag like v3.0.0 (matching "version" in package.json) to build OpenStickies for Windows,
# macOS and Linux and attach the builds to a draft GitHub release. Review the draft, then publish it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v3.0.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # A manual run builds the tag it was given, not the branch it was started from.
  CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

jobs:
  version:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Check the tag matches package.json
        id: check
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error title=Tag doesn't match package.json::Tag $TAG doesn't match package.json version $version. Set the version in package.json to match the tag, or tag the commit v$version instead."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build for ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      # One platform failing shouldn't hide whether the others build.
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --win nsis portable
            files: |
              dist/OpenStickies-Setup-*.exe
              dist/OpenStickies-Portable-*.exe
          - name: macOS
            os: macos-latest
            # MAC_IDENTITY comes from the "Pick how to sign the Mac build" step below.
            args: --mac dmg zip --arm64 --x64 -c.mac.identity="$MAC_IDENTITY"
            files: |
              dist/OpenStickies-*-mac-*.dmg
              dist/OpenStickies-*-mac-*.zip
          - name: Linux
            os: ubuntu-latest
            args: --linux AppImage deb --x64
            files: |
              dist/OpenStickies-*-linux-*.AppImage
              dist/openstickies_*.deb
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The postinstall script downloads Electron.
      - name: Install dependencies
        run: npm ci

      # With the repository secrets described in CONTRIBUTING.md ("Signing the Mac builds") the
      # Mac app is signed with that Developer ID and notarized by Apple, so it opens without a
      # warning. Without them it's signed ad hoc (identity "-", as in package.json) so Apple
      # silicon will run it, and macOS asks before the first launch. The Team ID doubles as the
      # identity to sign with: electron-builder picks the certificate whose name contains it.
      - name: Pick how to sign the Mac build
        if: runner.os == 'macOS'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        # The certificate goes into a keychain made here and handed to electron-builder as
        # CSC_KEYCHAIN, not through CSC_LINK: electron-builder 26 unlocks its own keychain with the
        # certificate's password instead of the keychain's, and fails with "SecKeychainUnlock: The
        # user name or passphrase you entered is not correct."
        run: |
          if [ -n "$APPLE_TEAM_ID" ] && [ -n "$MAC_CERTIFICATE" ]; then
            keychain="$RUNNER_TEMP/signing.keychain-db"
            keychain_pw=$(openssl rand -hex 24)
            echo "$MAC_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
            security create-keychain -p "$keychain_pw" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$keychain_pw" "$keychain"
            security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$MAC_CERTIFICATE_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild
            security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_pw" "$keychain" > /dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            rm "$RUNNER_TEMP/signing.p12"
            {
              echo "MAC_IDENTITY=$APPLE_TEAM_ID"
              echo "CSC_KEYCHAIN=$keychain"
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "Signing with the Developer ID of team $APPLE_TEAM_ID and notarizing."
          else
            echo "MAC_IDENTITY=-" >> "$GITHUB_ENV"
            echo "::notice title=Mac build signed ad hoc::Set the MAC_CERTIFICATE, MAC_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID secrets to sign and notarize it (see CONTRIBUTING.md)."
          fi

      # The Windows builds aren't signed.
      - name: Build
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft the release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Download the builds
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: out
          merge-multiple: true

      - name: Write SHA256SUMS.txt
        working-directory: out
        run: |
          ls -l
          # Every build of this version must be there, or the release would be missing a platform.
          for name in "OpenStickies-Setup-$VERSION.exe" "OpenStickies-Portable-$VERSION.exe" \
                      "OpenStickies-$VERSION-mac-arm64.dmg" "OpenStickies-$VERSION-mac-x64.dmg" \
                      "OpenStickies-$VERSION-linux-x86_64.AppImage" "openstickies_${VERSION}_amd64.deb"; do
            if [ ! -f "$name" ]; then echo "::error::Build output not found: $name"; exit 1; fi
          done
          # Plain `sha256sum` output, so `sha256sum -c SHA256SUMS.txt` works on Linux and macOS.
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write release notes
        id: notes
        env:
          # The same test as the "Pick how to sign the Mac build" step: notarized builds need no
          # first-launch note.
          MAC_NOTARIZED: ${{ secrets.APPLE_TEAM_ID != '' && secrets.MAC_CERTIFICATE != '' }}
        run: |
          # This version's section of CHANGELOG.md: everything after "## [x.y.z]" up to the next
          # "## " heading or the link definitions at the bottom of the file.
          body=''
          if [ -f CHANGELOG.md ]; then
            body=$(awk -v v="$VERSION" '
              found && (/^## / || /^\[[^]]+\]:[[:space:]]/) { exit }
              found { print }
              index($0, "## [" v "]") == 1 { found = 1 }
            ' CHANGELOG.md | sed -e '/[^[:space:]]/,$!d')
          fi
          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            echo "::warning title=No changelog entry::CHANGELOG.md has no section for $VERSION, so the draft has a generic description. Edit it before publishing."
            body="OpenStickies $VERSION for Windows, macOS and Linux."
          fi

          footer=$(cat <<'EOF'
          ---

          ### Download

          | Platform | File | What it is |
          |---|---|---|
          | Windows 10 and 11 | [`OpenStickies-Setup-{VERSION}.exe`]({DOWNLOAD}/OpenStickies-Setup-{VERSION}.exe) | **Installer.** Adds Start menu and desktop shortcuts. |
          | Windows 10 and 11 | [`OpenStickies-Portable-{VERSION}.exe`]({DOWNLOAD}/OpenStickies-Portable-{VERSION}.exe) | **Portable.** A single file that runs without installing anything. |
          | macOS, Apple silicon | [`OpenStickies-{VERSION}-mac-arm64.dmg`]({DOWNLOAD}/OpenStickies-{VERSION}-mac-arm64.dmg) | Disk image for M1 and later Macs. Drag OpenStickies to Applications. |
          | macOS, Intel | [`OpenStickies-{VERSION}-mac-x64.dmg`]({DOWNLOAD}/OpenStickies-{VERSION}-mac-x64.dmg) | Disk image for Intel Macs. |
          | Linux (x64) | [`OpenStickies-{VERSION}-linux-x86_64.AppImage`]({DOWNLOAD}/OpenStickies-{VERSION}-linux-x86_64.AppImage) | **AppImage.** Runs on most distributions without installing. |
          | Debian, Ubuntu (x64) | [`openstickies_{VERSION}_amd64.deb`]({DOWNLOAD}/openstickies_{VERSION}_amd64.deb) | Package for `apt`. |

          The macOS apps are also attached as `.zip` files.

          > **Windows protected your PC?** The Windows builds aren't code-signed, so SmartScreen may warn you the first time. Click **More info → Run anyway**.

          {MAC_NOTE}

          > **Running the AppImage:** make it executable first, then start it: `chmod +x OpenStickies-{VERSION}-linux-x86_64.AppImage && ./OpenStickies-{VERSION}-linux-x86_64.AppImage`. Some distributions need `libfuse2` installed to run AppImages. On GNOME, the tray icon needs the AppIndicator extension; without it, OpenStickies opens its notes list instead.

          To check a download, compare its SHA-256 hash with [`SHA256SUMS.txt`]({DOWNLOAD}/SHA256SUMS.txt). On macOS and Linux: `shasum -a 256 -c SHA256SUMS.txt --ignore-missing`. In PowerShell: `Get-FileHash .\OpenStickies-Setup-{VERSION}.exe`
          EOF
          )
          mac_note="> **macOS says OpenStickies can't be opened?** The Mac builds aren't notarized by Apple. Control-click (or right-click) OpenStickies in Applications and choose **Open**, then **Open** again. On macOS 15 and later, try to open it once, then go to **System Settings → Privacy & Security** and click **Open Anyway**. You only need to do this the first time."
          if [ "$MAC_NOTARIZED" = true ]; then
            mac_note="The Mac builds are signed with a Developer ID and notarized by Apple."
          fi
          download="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG"
          # Bash 5.2 otherwise turns "&" in a replacement into the matched text.
          shopt -u patsub_replacement 2>/dev/null || true
          footer=${footer//\{MAC_NOTE\}/$mac_note}
          footer=${footer//\{VERSION\}/$VERSION}
          footer=${footer//\{DOWNLOAD\}/$download}

          file="$RUNNER_TEMP/release-notes.md"
          printf '%s\n\n%s\n' "$body" "$footer" > "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          cat "$file"

      - name: Create or update the draft release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: OpenStickies ${{ env.VERSION }}
          body_path: ${{ steps.notes.outputs.file }}
          draft: true
          prerelease: ${{ contains(env.TAG, '-') }}
          fail_on_unmatched_files: true
          files: out/*

      - name: Summary
        env:
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          echo "Draft release for **$TAG** is ready to review and publish: $RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
